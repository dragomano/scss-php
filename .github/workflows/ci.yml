name: CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: zip
          coverage: none

      - name: Configure GitHub token
        run: composer config github-oauth.github.com "${{ secrets.GITHUB_TOKEN }}"

      - name: Install dependencies
        run: composer install

      - name: Run PHP-CS-Fixer
        run: composer run fix

      - name: Run Rector
        run: composer run rector

      - name: Run PHPStan
        run: composer run phpstan

      - name: Run Psalm
        run: composer run psalm

  test:
    needs: checks

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: [8.2, 8.3, 8.4, 8.5]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none

      - name: Configure GitHub token
        run: composer config github-oauth.github.com "${{ secrets.GITHUB_TOKEN }}"

      - name: Install dependencies
        run: composer install

      - name: Run tests
        shell: bash
        run: vendor/bin/pest --colors=always